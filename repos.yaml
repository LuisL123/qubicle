# Repos the team works on. Anything not listed is treated as shared.
#   owned:  your solo repos. Reviewer can merge after approval + green CI.
#   shared: Midas, forks, anything with other contributors. You merge.
#   protected: paths in an owned repo that still need you to merge.
# qb double-checks: an "owned" repo with other contributors is treated as shared.

repos:
  - repo: LuisL123/qubicle
    policy: owned
    # Team setup: PRs touching these always need Luis, even on an owned repo.
    protected: [rig.yaml, CULTURE.md, agents/, repos.yaml, config.yaml, bin/qb.mjs, bin/lib.mjs]
  # delegated: the orchestrator merges, after review-codex approves the PR's head commit.
  # CodeQL ("Analyze (python)") cannot run on the free plan, so it is not required.
  - repo: midas-intelligence/midas-reviewer
    policy: delegated
    ignore_checks: ["Analyze (python)"]
    # CI workflows run with the repo's secrets, so changes to them still go to Luis.
    protected: [.github/]
  # - repo: luis/qubicle
  #   policy: owned
  # - repo: midas-org/some-repo
  #   policy: shared

# Local folders the team works in that aren't GitHub repos. Always treated as
# shared: no PRs, no pushes. Read the folder's own rules file before touching it.
workspaces:
  - name: midas-bench
    path: ~/midas/bench-runs
    rules: ~/qubicle/work/specs/midas-bench/notion.md   # Notion snapshot (gitignored)
  - name: midas-bench-arms
    path: ~/midas/bench-arms
    rules: ~/qubicle/work/specs/midas-bench/notion.md
