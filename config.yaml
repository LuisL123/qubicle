# Discord bridge (away mode). The bot token lives in Keychain, not here.
discord:
  guild: "1555504210521358416"
  owner: "310555910017646592"   # only this user can answer or command the bot
  # channels: create these as text channels in the server
  #   digest, decisions, updates, orchestrator

# Explainer: a second model that posts a plain-words breakdown and a suggestion
# in every decision thread. Reply "? <question>" in the thread to ask it more.
explainer:
  runtime: claude  # codex (ChatGPT plan), claude (Claude plan), or off
  model: sonnet    # empty = that runtime's default

# Nightly self-update (scripts/update.sh, 4:30). Paths listed under keep are
# backed up before updating and restored if an update deletes them.
update:
  keep:
    - ~/.local/share/claude/versions/2.1.286   # pinned by the Midas benchmark harness

# Second opinion: a fresh model judges big moves (qb propose/ask --big, qb critique)
# against GOAL.md. Use a different family from the orchestrator so it's independent.
second_opinion:
  runtime: codex   # codex, claude, or off
  model: ""
